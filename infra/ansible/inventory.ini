# Talos nodes have no SSH — Ansible never touches the node itself. Everything
# here runs on the control machine (localhost) and talks to the Kubernetes API
# using the kubeconfig produced by Terraform.
[local]
localhost ansible_connection=local

# The Proxmox HOST (not the Talos VM) — used only by proxmox-vfio.yml.
# Fill in the host's LAN IP or ssh alias:
[proxmox]
# eppan-datacenter ansible_host=192.168.1.X ansible_user=root
