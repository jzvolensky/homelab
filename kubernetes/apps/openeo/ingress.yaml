apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: grappa
    namespace: openeo
    annotations:
        # `web` only: there is no certificate for this name, and it is not a
        # host the Cloudflare tunnel routes — the tunnel maps specific public
        # hostnames to Services, so nothing here reaches the internet.
        traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
    ingressClassName: traefik
    rules:
        - host: openeo.192.168.1.250.nip.io
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: grappa
                            port:
                                number: 8080
