apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Each entry is an Argo CD Application (app-of-apps). The root app syncs these;
# each Application then deploys its own workload. Add apps as you migrate them
# from the old homelab-deployments repo.
resources:
    - traefik/traefik-app.yaml # ingress controller (Helm)
    - argocd-config/argocd-config-app.yaml # expose argocd + GitHub OAuth
    - webserver/application.yaml # website
    - llm/application.yaml # llama.cpp OpenAI-compatible LLM server (GPU/Vulkan)
    - openwebui/application.yaml # authenticated chat UI for the llm app
    - local-path-provisioner # directory: namespace carries a PSS label CreateNamespace cannot set
    - openeo/application.yaml # openEO API backend (Grappa) + its PostgreSQL
    - keycloak/application.yaml # OIDC provider for the openEO backend
