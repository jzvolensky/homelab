apiVersion: apps/v1
kind: Deployment
metadata:
    name: llama-server
    namespace: llm
spec:
    replicas: 1
    # Recreate: the node can't fit two model copies in RAM during a rolling update.
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: llama-server
    template:
        metadata:
            labels:
                app: llama-server
        spec:
            # Fetch the model with curl + SHA-256 verification instead of
            # llama-server's built-in -hf downloader, whose cache layer
            # corrupted reads on this image (verified: blob on disk hashed
            # correct while the loader failed on it).
            initContainers:
                - name: fetch-model
                  image: curlimages/curl:latest
                  securityContext:
                      runAsUser: 0 # hostPath is root-owned
                  env:
                      - name: MODEL_URL
                        value: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
                      - name: MODEL_SHA256
                        value: 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
                      - name: MODEL_FILE
                        value: Qwen3.5-4B-Q4_K_M.gguf
                  command:
                      - sh
                      - -c
                      - |
                          set -e
                          F="/models/$MODEL_FILE"
                          if [ -f "$F" ] && echo "$MODEL_SHA256  $F" | sha256sum -c -; then
                              echo "model present and verified"
                              exit 0
                          fi
                          echo "downloading $MODEL_URL"
                          curl -fSL --retry 5 --retry-delay 5 -C - -o "$F.part" "$MODEL_URL"
                          echo "$MODEL_SHA256  $F.part" | sha256sum -c -
                          mv "$F.part" "$F"
                  volumeMounts:
                      - name: models
                        mountPath: /models
            containers:
                - name: llama-server
                  image: ghcr.io/ggml-org/llama.cpp:server-vulkan
                  imagePullPolicy: Always
                  securityContext:
                      privileged: true
                  args:
                      # Model file staged by the fetch-model initContainer
                      # (see README.md "Swapping models").
                      - -m
                      - /models/Qwen3.5-4B-Q4_K_M.gguf
                      - --alias
                      - qwen3.5-4b
                      - --host
                      - 0.0.0.0
                      - --port
                      - "8080"
                      # 2.74 GB of weights leaves ~7 GB of GTT headroom, so this
                      # can go a good deal higher if a workload needs it. Kept
                      # modest because KV cache competes for the same memory
                      # bandwidth that caps token generation on this iGPU.
                      - --ctx-size
                      - "8192"
                      # Offload all layers to the iGPU.
                      - -ngl
                      - "99"
                      # CPU only feeds the GPU now; 4 threads is plenty.
                      - --threads
                      - "4"
                      # Use the model's real chat template. Required for correct
                      # tool calling and for --chat-template-kwargs below.
                      - --jinja
                      # The Qwen3.5 small series (0.8B/2B/4B/9B) ships with
                      # reasoning off by default, unlike the larger Qwen3.5
                      # models and unlike the Qwen3-8B this replaced. Pinned
                      # explicitly so the behaviour can't drift with a template
                      # update. Set to true to get <think> blocks back.
                      - --chat-template-kwargs
                      - '{"enable_thinking":false}'
                      # Flash attention: prerequisite for the quantized KV cache
                      # below, and reduces attention memory traffic.
                      - -fa
                      - "on"
                      # Halve KV cache bandwidth. If the server fails to load
                      # with a cache-type error, drop these two pairs first —
                      # they are the least essential flags here.
                      - --cache-type-k
                      - q8_0
                      - --cache-type-v
                      - q8_0
                      # Skip mmap so the weights aren't held in page cache in
                      # addition to the GTT copy. Matters on a RAM-tight guest.
                      - --no-mmap
                  ports:
                      - containerPort: 8080
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      periodSeconds: 15
                      failureThreshold: 120
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      periodSeconds: 30
                  resources:
                      requests:
                          cpu: "1"
                          memory: 4Gi
                      limits:
                          memory: 10Gi
                  volumeMounts:
                      - name: models
                        mountPath: /models
                      - name: dri
                        mountPath: /dev/dri
            volumes:
                # Talos: hostPath must live under /var. Single-node cluster, so
                # no CSI needed; the cache survives pod restarts and re-syncs.
                - name: models
                  hostPath:
                      path: /var/mnt/models
                      type: DirectoryOrCreate
                # Radeon 780M passed through from Proxmox; amdgpu driver via
                # the Talos schematic's amdgpu extension.
                - name: dri
                  hostPath:
                      path: /dev/dri
                      type: Directory
