apiVersion: apps/v1
kind: Deployment
metadata:
    name: llama-server
    namespace: llm
spec:
    replicas: 1
    # Recreate: the node can't fit two model copies in RAM during a rolling update.
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: llama-server
    template:
        metadata:
            labels:
                app: llama-server
        spec:
            # Fetch the model with curl + SHA-256 verification instead of
            # llama-server's built-in -hf downloader, whose cache layer
            # corrupted reads on this image (verified: blob on disk hashed
            # correct while the loader failed on it).
            initContainers:
                - name: fetch-model
                  image: curlimages/curl:latest
                  securityContext:
                      runAsUser: 0 # hostPath is root-owned
                  env:
                      # To swap models: change these three AND the -m arg below.
                      - name: MODEL_URL
                        value: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
                      - name: MODEL_SHA256
                        value: 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
                      - name: MODEL_FILE
                        value: Qwen3-0.6B-Q8_0.gguf
                  command:
                      - sh
                      - -c
                      - |
                          set -e
                          F="/models/$MODEL_FILE"
                          if [ -f "$F" ] && echo "$MODEL_SHA256  $F" | sha256sum -c -; then
                              echo "model present and verified"
                              exit 0
                          fi
                          echo "downloading $MODEL_URL"
                          curl -fSL --retry 5 --retry-delay 5 -C - -o "$F.part" "$MODEL_URL"
                          echo "$MODEL_SHA256  $F.part" | sha256sum -c -
                          mv "$F.part" "$F"
                  volumeMounts:
                      - name: models
                        mountPath: /models
            containers:
                - name: llama-server
                  # Vulkan build targeting the passed-through Radeon 780M
                  # (2 GB VRAM carve + ~10 GB GTT — models up to ~12 GB fit).
                  image: ghcr.io/ggml-org/llama.cpp:server-vulkan
                  imagePullPolicy: IfNotPresent
                  securityContext:
                      # Simplest way to use /dev/dri on Talos; the namespace
                      # is PSA-privileged already.
                      privileged: true
                  args:
                      # Model file staged by the fetch-model initContainer.
                      # Currently the tiny smoke-test model; for the real one
                      # (Qwen3-8B Q4_K_M) see README.md "Swapping models".
                      - -m
                      - /models/Qwen3-0.6B-Q8_0.gguf
                      - --alias
                      - qwen3-0.6b
                      - --host
                      - 0.0.0.0
                      - --port
                      - "8080"
                      - --ctx-size
                      - "8192"
                      # Offload all layers to the iGPU.
                      - -ngl
                      - "99"
                      # CPU only feeds the GPU now; 4 threads is plenty.
                      - --threads
                      - "4"
                  ports:
                      - containerPort: 8080
                  # First start downloads the model; allow up to 30 min.
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      periodSeconds: 15
                      failureThreshold: 120
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      periodSeconds: 30
                  resources:
                      requests:
                          cpu: "1"
                          memory: 4Gi
                      limits:
                          # Weights live in GPU GTT memory (not charged to the
                          # pod cgroup); this covers load-time page cache + KV.
                          memory: 10Gi
                  volumeMounts:
                      - name: models
                        mountPath: /models
                      - name: dri
                        mountPath: /dev/dri
            volumes:
                # Talos: hostPath must live under /var. Single-node cluster, so
                # no CSI needed; the cache survives pod restarts and re-syncs.
                - name: models
                  hostPath:
                      path: /var/mnt/models
                      type: DirectoryOrCreate
                # Radeon 780M passed through from Proxmox; amdgpu driver via
                # the Talos schematic's amdgpu extension.
                - name: dri
                  hostPath:
                      path: /dev/dri
                      type: Directory
