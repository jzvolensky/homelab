apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: keycloak
    namespace: keycloak
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
    ingressClassName: traefik
    rules:
        # Add this hostname to the Cloudflare tunnel pointing at Traefik, the
        # same way the website is routed. TLS terminates at Cloudflare, which is
        # why there is no tls: block and why Keycloak is told to trust
        # X-Forwarded-Proto rather than serving HTTPS itself.
        - host: keycloak.jzvolensky.com
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: keycloak
                            port:
                                number: 8080
